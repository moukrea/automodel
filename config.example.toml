# ~/.config/automodel/config.toml — router behaviour only (models live in the catalog).
listen = "127.0.0.1:8788"
upstream = "https://api.anthropic.com"
custom_model_id = "jev"
# Routing tuning (see `automodel tuning`):
#   "default": automodel's catalog, shipped in the binary and updated with every release;
#   "custom":  the file at `catalog` below, layered over the default (your keys win).
tuning = "default"
catalog = "catalog.toml"   # your custom tuning file; hot-reloaded; relative paths resolve from this file
# state_dir = "~/.local/state/automodel"      # sessions, prompt index, hooks.log, catalog.lastgood.toml
# ledger = "~/.local/state/automodel/ledger.jsonl"
cache_ttl = "1h"
jev_timeout = "4s"
state_budget_tokens = 24000
theta_act = 0.6
theta_low = 0.35
# A subagent model the caller names is kept only when you asked for a model
# (a [model:X] pin, or a model asked in words for the work); false routes all.
respect_explicit_subagent_model = true
jev_shadow_model = ""            # set during a new Jev version's observation period
# stale_days = 60                # catalog data older than this warns
# repo_policy_file = ".automodel.toml"   # min_tier / max_tier / min_subagent_tier / max_subagent_tier
# privacy = "full"   # "metadata": Jev gets sizes and task-kind hints, never the text of prompts, replies or repo files
# record_states = true  # keep each decision's routing state locally (state_dir/states) for `automodel flag`
# statusline_flash = "30s"
# OpenRouter key for Jev ($OPENROUTER_API_KEY wins if set). Keep this file 0600.
openrouter_api_key = ""

# statusline_command = "~/.claude/statusline-command.sh"   # your own statusline, shown before ours
#   (runs with AUTOMODEL_CHAINED=1; agentline renders the routing itself: no need to chain it)
# route_workflow_steps = true

# v2 features (all default on). With all three off the router behaves as v1:
# decisions only when the prompt cache is already lost (first prompt,
# compaction, cold cache), with the confidence-escalation policy.
[features]
# Re-evaluate the tier on warm turns too. A follow-up of the work in
# progress keeps at least its tier; separate work gets its own level. A
# switch has to beat its cost (see cost_aware), and a downgrade that costs
# something (a cache rebuild) must also clear warm_min_confidence.
warm_decisions = true
# Change effort mid-conversation without losing the prompt cache
# (effort-only system messages; models with per_turn_effort in the catalog).
per_turn_effort = true
# Pick tiers by expected cost: working at a wrong effort (underprovision
# costs catalog meta.underprovision_penalty x the gap) against the cost of a
# switch (a cache rebuild of the whole context, unless per-turn effort keeps
# it). When no switch could pay back, Jev is not even asked.
cost_aware = true
warm_min_confidence = 0.8
warm_timeout = "4s"
# Prompts a switch is expected to serve, when weighed against a cache rebuild.
switch_horizon_prompts = 3
# Everything below is on by default; set a key to false (or "") to turn it off.
# Subagents keep their prompt cache this long (Claude Code's default is 5m,
# so a subagent idle for longer writes its whole context again). "" leaves
# Claude Code's default. Written to settings.json by install.
subagent_cache_ttl = "1h"
# The costliest tier (max) only when Jev's own answer is max, never on a
# split reading the underprovision penalty would settle there.
max_on_jev_reading = true
# Route subagents whose caller (Claude) named a model, unless you asked for
# a model yourself ([model:X] or in words).
route_named_subagent_models = true
# Forks keep their parent's model and effort, so they read its cache.
forks_inherit = true
# A scheduled prompt read apart from the work (a status check) takes its own
# level instead of the work's.
scheduled_own_level = true
# Show Jev what a workflow stage built from the script's data reads (else
# such a stage keeps the session's model and effort).
blind_stage_context = true
# Name the custom model in routed responses, so claude --resume stays routed.
name_custom_model = true
# Handing a pin back ([effort:auto]) judges the work done while pinned again.
rejudge_on_pin_release = true
# A follow-up that says the last work was left undone or botched keeps the
# level the turn ran at instead of going back to the work's.
rework_keeps_level = true

# Spending cap (prices from the catalog). Once reached, routing stays at or
# below max_tier_when_over until the next day (or session). Pins are not capped.
# [budget]
# usd_per_day = 0                             # 0 = off
# usd_per_session = 0
# max_tier_when_over = "medium"
# max_subagent_tier_when_over = "sonnet-xhigh"
