# The GitHub Pages site (site/), built from README.md, catalog.toml and the
# latest release tag. It deploys when any of them changes on main and after
# every release (the release workflow tags with GITHUB_TOKEN, which starts no
# other workflow by itself: workflow_run does).
name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "README.md", "docs/media/**", "catalog.toml", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # tags: the site shows the latest release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: node build.mjs
        working-directory: site
      # The videos live on the "media" prerelease (too big for git); the
      # site serves them itself.
      - run: gh release download media --pattern '*.mp4' --dir site/dist/media
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
