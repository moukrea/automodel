# Every push to main that touches code ships a release. The version comes
# from the commit messages since the last tag (Conventional Commits):
# "feat:" → minor, "!" or "BREAKING CHANGE" → major, anything else → patch.
name: release
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".claude/**"]
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Next version
        id: version
        shell: bash
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            next=v0.1.0
          else
            if [ -z "$(git log --format=%H "$last..HEAD")" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            log=$(git log --format='%s%n%b' "$last..HEAD")
            IFS=. read -r major minor patch <<< "${last#v}"
            if grep -qE '^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE' <<< "$log"; then
              next=v$((major + 1)).0.0
            elif grep -qE '^feat(\([^)]*\))?:' <<< "$log"; then
              next=v$major.$((minor + 1)).0
            else
              next=v$major.$minor.$((patch + 1))
            fi
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
      - name: Tag
        if: steps.version.outputs.skip != 'true'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
      - uses: goreleaser/goreleaser-action@v6
        if: steps.version.outputs.skip != 'true'
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
