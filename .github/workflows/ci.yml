name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go run ./cmd/automodel catalog check --catalog catalog.toml
      - run: sh -n install.sh
  # install.sh end to end in clean containers, with the binary built from this
  # commit. Neither image has a systemd user session: the proxy runs detached.
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:stable-slim", "fedora:latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/install-test.sh "${{ matrix.image }}"
        env:
          CONTAINER_ENGINE: docker
  # macOS: tests, then install.sh end to end with the launchd agent.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...
      - run: scripts/install-test.sh --host
  # The release packages: GoReleaser config, deb/rpm install (post-install
  # message included), the Homebrew formula, and publishing without secrets.
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: Install the packages
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:stable-slim sh -c \
            'dpkg -i /dist/automodel_*_amd64.deb | tee /tmp/out && grep -q "run .automodel install." /tmp/out && automodel version'
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest sh -c \
            'rpm -i /dist/automodel-*.x86_64.rpm | tee /tmp/out && grep -q "run .automodel install." /tmp/out && automodel version'
      - name: Homebrew formula and publishing without secrets
        run: |
          ver=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' dist/metadata.json)
          scripts/homebrew-formula.sh "$ver" dist/checksums.txt
          scripts/publish-packages.sh "$ver" dist | grep -q 'RELEASE_TOKEN is not set'
