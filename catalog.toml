[models.claude-sonnet-5-5]
label = "Sonnet 5.5"
status = "active"
reason = "On the cost/quality frontier against Opus 5.5 at low and high on every benchmark with per-effort data for both (index v4.3.2, CursorBench 4.0, Terminal-Bench 4.0 as Anthropic and as AA run it, FrontierCode 1.1): used for subagents at low (reading and reporting) and high (bounded work with a known recipe). Medium is on the frontier on CursorBench, Anthropic's Terminal-Bench and FrontierCode but dominated by Opus low on the index (41 at $0.59 vs 42 at $0.55) and on AA's Terminal-Bench (29.8% at $2.25 vs 31.3% at $2.08): no tier. Xhigh is dominated by Opus high almost everywhere (index 52 at $2.74 vs 54 at $1.82; CursorBench 53.1% at $3.88 vs 56.0% at $3.97). Max leads on terminal work only (Coding Agent Index in Claude Code 68.4 vs Opus max 66.0; Terminal-Bench 4.0 70.6 vs Opus xhigh 66.4) and trails on SWE-bench Pro (81.3 vs 89.9), CursorBench and the index, at more tokens per task: no tier. No main tier: at the levels main sessions mostly need (medium and up) Opus scores more for the money on every coding benchmark, cache reads cost the same $0.20/M and make up about 60% of a real main session's cost (ledger, ~470k tokens read per request), and a switch rewrites the cache and drops the thinking blocks (neither model reads the other's)."
api_id = "claude-sonnet-5-5"
alias = "sonnet"
context = 1_000_000
long_context = "native"
max_output = 128_000
efforts = ["low", "medium", "high", "xhigh", "max"]
default_effort = "medium"
per_turn_effort = true
price = { input = 2.0, output = 10.0, cache_read = 0.20, cache_write_5m = 2.50, cache_write_1h = 4.0 }
scopes = ["subagent"]
verified_at = "2026-09-29"
sources = [
  "https://platform.claude.com/docs/en/about-claude/pricing",
  "https://platform.claude.com/docs/en/models/sonnet-5-5/overview",
  "https://platform.claude.com/docs/en/models/sonnet-5-5/whats-new-sonnet-5-5",
