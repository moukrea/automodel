reason = "Subagent Haiku tier at medium (Anthropic's advice: low skips searches and checks on agent prompts, medium halves that) and the main session's asked Haiku tier at low (no cache to lose, prompts under 100k tokens). Prices step up 5x for the whole request once its prompt passes 100k tokens (0.50/2.50, writes 0.625/1.00, read 0.05; the catalog keeps the lower ones): 88% of this owner's subagent requests and 96% of their cost are past it (ledger, 2026-10-01 to 10-08, median request 279k tokens). Priced on those real requests with CursorBench's steps and tokens per task, Haiku still costs about half of Sonnet at the same effort (medium 0.10 vs 0.20, high 0.16 vs 0.33, Opus high = 1; docs/research/2026-10-model-mix.md), but it is on the agentic-coding frontier in Claude Code only below Sonnet low: Coding Agent Index v1.5 (Claude Code, pre-release build) low/medium/high 28.2/33.6/35.1 vs Sonnet low 42.1, xhigh 41.4 at 1.6x Sonnet low's cost per task ($0.61 vs about $0.38 at the $0.10 cache read), max 36.5 below xhigh; Anthropic's Terminal-Bench 4.0 high 24.8 at 0.16 vs Sonnet medium 28.8 at 0.20; FrontierCode xhigh 45.8 below Sonnet high's 49.4. It takes 2-3x Sonnet's steps (CursorBench medium 39 vs Sonnet low 18) and 2-3x its wall time (Coding Agent Index high 1107 s vs Sonnet low 381 s). No tier above mechanical work. AA's index and per-eval costs price every token at the lower rate (AA's own note): they are kept under v4.3.2-flat-price, not v4.3.2."
api_id = "claude-haiku-5-5"
alias = "haiku"
context = 1_000_000
long_context = "native"
max_output = 128_000
efforts = ["low", "medium", "high", "xhigh", "max"]
default_effort = "medium"
per_turn_effort = true
price = { input = 0.10, output = 0.50, cache_read = 0.01, cache_write_5m = 0.125, cache_write_1h = 0.20 }
scopes = ["main", "subagent"]
verified_at = "2026-10-08"
sources = [
  "https://platform.claude.com/docs/en/about-claude/pricing",
  "https://www.anthropic.com/claude-haiku-5-5 (chart data)",
