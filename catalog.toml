[models.claude-sonnet-5-5]
label = "Sonnet 5.5"
status = "active"
reason = "Subagents at low (reading and reporting), high (small changes and work with a known recipe) and xhigh (design, research and multi-file work with edge cases). Cache reads cost $0.10/M since 2026-10-07, half of Opus 5.5's, and they are most of a Claude Code agent's cost (this owner's subagents: median request 279k tokens). Priced on the owner's real subagent requests with each config's steps and tokens per task (CursorBench 4.0; docs/research/2026-10-model-mix.md), Opus high = 1: Sonnet high 0.33 scores above Opus low 0.47 on all five per-effort coding benchmarks (Anthropic's Terminal-Bench 4.0 43.0 vs 38.5, FrontierCode 49.4 vs 47.3, CursorBench 47.8 vs 43.7, AA Terminal-Bench 43.9 vs 31.3, index 46.8 vs 42.3); Sonnet xhigh 0.62 scores at least Opus medium's (0.80) on four of five (61.5 vs 57.6, 53.1 vs 52.5, 57.1 vs 52.5, 51.9 vs 51.2; FrontierCode 52.1 vs 54.6) and 1.7 to 2.9 points under Opus high's on four (61.5 vs 64.2, 52.1 vs 54.0, 53.1 vs 56.0, 51.9 vs 53.6; AA Terminal-Bench 57.1 vs 56.6), about one standard error of Terminal-Bench (2.5 points), for 0.62 vs 1 (0.83 if it takes 1.37x CursorBench's relative steps in Claude Code, as Coding Agent Index max suggests): Opus high doesn't clearly win, so the two Opus levels below xhigh run on Sonnet xhigh. At list prices on short benchmark prompts Opus high is cheaper (index $1.82 vs $2.01): the primary benchmark flags sonnet-xhigh as dominated, the owner's traffic does not. Xhigh is 1.4-1.5x slower per task (AA Terminal-Bench 1106 s vs Opus high 806 s). Medium: no tier (low and high bracket it). Max: no tier, verbose in Claude Code (FrontierCode 598k output tokens and 46.2 at $20.78; Coding Agent Index 266 steps vs Opus max 155). No main tier: replayed on this owner's routed main sessions (median context 556k), Sonnet for the low and medium levels saves at most 1.8% with a perfect switch oracle and costs 9% more switching on every low or medium stretch (12% if Sonnet takes 1.37x CursorBench's relative steps), because a switch writes the whole context again (about $2.2 at the median context) and low or medium stretches last 10-11 requests (median)."
