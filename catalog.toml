# Model catalog: the single source of truth for models, prices, measurements,
# tiers and Jev criteria. Hot-reloaded by the proxy and hooks.
# Change it through the refresh-model-catalog skill; log every change in
# catalog-history.md. Validate with: automodel catalog check

[meta]
schema = 1
last_refresh = "2026-09-30"
benchmark = "artificial-analysis-intelligence-index"
benchmark_version = "v4.3.2"
jev_model = "typesafe/jev-1.13"
default_main_tier = "high"
default_subagent_tier = "opus-medium"
# Windows above 200k: long_context = "native" models get it without a beta
# (the proxy strips the beta for them: on a native model it defeats the
# prompt cache); long_context = "beta" models need this anthropic-beta value.
long_context_beta = "context-1m-2025-08-07"
# Main-session tiers must offer at least this window (long sessions break on less).
main_min_context = 1_000_000
# Effort-only system messages mid conversation (models with per_turn_effort):
# an effort change keeps the prompt cache. Claude Code uses the same beta.
per_turn_effort_beta = "per-turn-control-2026-07-01"
# Working below the right tier costs this many times the cost gap (rework,
# wrong answers); working above it costs the gap once. 1.5 from `automodel
# eval` (docs/research/2026-09-routing-quality.md): same exact accuracy as
# Jev's top level and the lowest realized cost loss; 3.0 pushed medium work
# to high and high to xhigh (held-out exact 85% vs 93%).
underprovision_penalty = 1.5
# The work in progress: a prompt gets its own level, below the work's if
# that is its level, only when Jev's relation answer puts at least this on
# the separate relations (new_task + wrap_up + aside) and it didn't come in
# mid-turn or from another session; any other prompt follows the work up
# and keeps at least its level. Going back to paused work (resume) needs
# it too. From `automodel eval` (train split, split by conversation, two
# runs of 3, 2026-09-30): on the same answers 0.45 to 0.55 give the same
# decisions (exact 91%, rank error 0.10 to 0.11, no follow-up below its
# work); 0.4 lowers two or three follow-ups, 0.6 and up hold separate
# prompts at the work. Resumes put 0.75 or more on resume. 0.55: the top
# of that plateau, on the holding side. Round 3 (held-out run 1 merged
# into train, round 3 wording): 0.45 to 0.55 still keep every follow-up
# at its work and differ by one to three answers on wrap-ups and asides;
# 0.4 lowers "just curious, carry on" after a routing question. Round 4
# (held-out run 2 merged into train, go-aheads to a proposal after a
# detour asked here): 0.55 and 0.6 give the same decisions; 0.5 lowers one
# follow-up below its work, 0.45 two.
relation_separate_threshold = 0.55
# A bare go-ahead after a detour, when the paused work needs more and the
# assistant's last message asks something ([questions.offer]): it goes
# back to the paused work unless the offer question says yes from this
# probability (the assistant offered one more thing for the detour, which
# the go-ahead accepts: a wrap-up step, more of it). Train split (round 4
# review, 3 runs): closing questions that offer nothing of the detour
# ("Anything else?", "Shall I carry on?", "Ça te va ?") and offers to go
# back 0.04 to 0.18 (eleven of the fourteen closers are not in the
# wording); offers of a wrap-up step or more of the detour 0.80 to 0.96.
# 0.5: the middle of that gap. Second review (2026-10-01): answered with
# an acknowledgement ("ok", "perfect", "lgtm", "nickel", "parfait"), live
# offers read 0.27 to 0.44 and went back to the paused work. With
# acknowledgements in the yes wording and 16 new train cases (two runs of
# 3): offers 0.51 and up, closing questions and offers to go back at most
# 0.20. 0.35: the middle of that gap. Round 5 review: French
# acknowledgements to French offers read at that bar (0.33-0.39 on probes).
# With 7 new train cases of them (3 runs): offers 0.34 and up, but for
# "ok" to "Dis-moi si j'applique la même attente aux tests..." after a
# commit (0.12-0.14, among the closers: it goes back, the safe side);
# closing questions and offers to go back still at most 0.20. 0.27: the
# middle of the 0.20-0.34 gap.
detour_offer_threshold = 0.27
# A request in the prompt's words (an effort, more thinking, ultracode or
# its refusal) counts from this yes-probability; an effort below the work
# in progress needs 0.9 (router.LowerEffortP). Train split (two runs of
# 3): efforts asked in words 0.82 to 0.98, lowerings Jev is less sure of
# left to the 0.9 bar ("switch to medium for the rest" 0.85 to 0.87,
# "effort élevé, pas plus" 0.47 to 0.55); ultracode 0.84 to 0.97, but
# parallel agents asked or refused without naming it 0.61 to 0.80;
# mentions, efforts set for subagents, workflow stages, tenant configs or
# tuning files, quoted prompts and refusals at most 0.22. Precision
# first: 0.8. Round 3, with lowerings and caps in the yes wording: lower
# efforts for the rest of the work asked with their reason 0.93 to 0.96
# ("switch to medium for the remaining test rewrites" was 0.86 to 0.88),
# "mets le paquet" 0.94 (was 0.45), "effort élevé, pas plus" 0.63 to
# 0.67, raises 0.82 and up; mentions and refusals at most 0.16 (efforts),
# 0.23 (modes). Round 4 (an effort for a part of the work is the
# assistant's own; "more thinking than usual"): lowerings 0.90 and up, at
# the 0.9 bar ("low suffit pour la suite" 0.90-0.92, was 0.86-0.89),
# "effort élevé, pas plus" 0.66-0.80, raises 0.83 and up, more thinking on
# a new task or an aside 0.92-0.93 (was 0.55-0.77); mentions and refusals
# at most 0.18, besides the xhigh a lowering refuses ("xhigh is overkill",
# 0.41-0.54). Parallel agents asked in French words 0.86-0.88 (was
# 0.79-0.80), in English 0.50-0.83: a mode question of its own read them at
# 0.94 and up, but confirmed a mention on the repo's test split, so it was
# not kept. The bars stay: the train gap supports them, and a mention was
# read at 0.88 live.
explicit_threshold = 0.8
# A model asked for in words (only another model than the session's; the
# work in progress runs on it until a separate new task) counts from this
# yes-probability, stricter than for an effort or a mode: a wrong model
# runs the whole work, and models are talked about far more than asked for.
# Train split (two runs of 3): requests 0.83 to 0.93; mentions (news,
# comparisons, benchmarks, routing questions, a subagent's, a catalog's or
# a config's model) and refusals at most 0.21. Round 3: the same, besides
# two requests of held-out run 1 left below it ("Run this on Sonnet, it's
# simple" 0.66 to 0.71, "switch this to Opus for the tricky test" 0.76
# to 0.80). Round 4 (a part of the work, with its reason, in the yes
# side): requests 0.82 to 0.91 ("Run this on Sonnet" 0.88-0.89, "switch
# this to Opus for the tricky test" 0.82-0.86); mentions at most 0.32.
# Round 4 review: the example that quoted "Run this on Sonnet, it's
# simple" was paraphrased, and that case reads 0.70-0.76 again; the other
# requests 0.82 to 0.93, mentions at most 0.32.
explicit_model_threshold = 0.85

