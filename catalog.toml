index = 59.6
cost_per_task = 13.11
time_per_task_s = 1699
output_tokens_per_task = 252900
benchmark_version = "aa-terminal-bench-4.0"
measured_at = "2026-09-29"
source = "https://artificialanalysis.ai/models/claude-sonnet-5-5"

# ------------------------------------------------------------ main tiers
# Opus tiers vary only the effort (per-turn effort keeps the prompt cache
# across effort changes). Their criteria are the levels of Jev's Score
# question, lowest first: describe situations, not degrees.
#
# Haiku is an asked tier: its own yes/no question, asked in the same call,
# and it replaces low when Jev says yes (threshold from `automodel eval`,
# train split: Haiku cases >= 0.95, other low cases <= 0.90; round 4, with
# one-liners and Haiku asked by name in the criteria: Haiku cases 0.92 and
# up but "use haiku for this, it's trivial: list the markdown files
# without a title" (0.57-0.62), cases Haiku would not do at most 0.90). It changes the
# model, which rebuilds the prompt cache, so it is taken on a new session,
# after /compact or a pause (no cache to lose) or when already on it; a warm
# Opus session never moves there (a Haiku turn on a warm cache costs about
# Opus low, and coming back rebuilds the context).
[tiers.main.haiku]
rank = 0
model = "claude-haiku-4-5"
# Priced as it runs (no thinking), like the Haiku subagent tier.
cost = 0.14
# Haiku's window is 200k: past this the session moves up to Opus (routing
# constrains to the next tier that fits; the proxy does it within a turn).
max_context = 150_000
question = "Could a small, fast model handle this prompt just as well: no reasoning, and no need to look at the code or the work so far?"
criteria = "A general knowledge question, a shell command, one-liner or flag to write or explain, what an error code or a regex means, a trivial edit spelled out in full (a typo, one rename in one file), or a trivial task the user hands to Haiku by name ('use haiku for this')."
no = "Anything that needs this project's code, the conversation or some thought: a question about the project or the work done, a bug to investigate, a change with choices, a review, a summary or a commit message."
threshold = 0.92


[tiers.main.low]
rank = 1
model = "claude-opus-5-5"
effort = "low"
criteria = "Answering a question or making a small, fully specified change with nothing to lose: lookups, explaining a known concept, renames, typo fixes, formatting, commit messages, summaries of work already done."

[tiers.main.medium]
rank = 2
model = "claude-opus-5-5"
effort = "medium"
criteria = "A routine change with a clear recipe in one area: a small feature or endpoint with tests, a bug whose cause is evident, straightforward tests or docs for existing code, a cleanup that deletes files or data once what is safe to remove has been worked out (old builds, caches, temporary files)."

[tiers.main.high]
rank = 3
model = "claude-opus-5-5"
effort = "high"
criteria = "A change spanning several files or components, with real edge cases and some design choices: refactors, integrations, migrating a module, performance work on a known bottleneck."

[tiers.main.xhigh]
rank = 4
model = "claude-opus-5-5"
effort = "xhigh"
criteria = "A hard problem where a wrong answer is expensive: race conditions and concurrency, security-sensitive logic, subtle bugs of unknown cause, architecture with trade-offs, correctness arguments."

[tiers.main.max]
rank = 5
model = "claude-opus-5-5"
effort = "max"
criteria = "Exceptional difficulty: long-standing bugs nobody could find, research-grade algorithms or proofs, where exhaustive reasoning is worth any cost."

# ------------------------------------------------------------------ modes
# A mode is layered on top of whatever tier (and model) is chosen.

[modes.ultracode]
scopes = ["main"]
workflows = true
effort = "xhigh"
min_tier = "high"
# From `automodel eval` (train split, two runs of 3, 2026-09-30): Jev turns
# it on for new work at 0.86 and up on the cases labeled on; on the cases
# labeled off it reads 0.73 to 0.78 for a Terraform migration resumed across
# six environments and a remark typed during a form migration (0.82 for a
# Moment.js removal), which 0.75 turned on. A wrap-up, a side question or
# an aside never runs with it (router.Judge).
threshold = 0.8
question = "Would this work be done better by several agents working in parallel (workflow orchestration) than by one assistant working alone?"
yes = "Broad work that splits into many independent parts: auditing or reviewing a whole codebase, sweeping migrations across many files or services, multi-angle research or plans cross-checked by independent reviewers."
no = "Work one assistant does well alone: a single feature, bug, question, or refactor of one area, and anything small or sequential."

# -------------------------------------------------------- subagent tiers
# The Agent tool only accepts model aliases, so subagent models need `alias`.

[tiers.subagent.haiku]
rank = 1
model = "claude-haiku-4-5"
# Priced as it runs (no thinking): a quarter of Opus 5.5's per-token prices
# × Opus low's cost per task (0.55). Ledger 2026-09-27: 115 routed Haiku
# subagent requests averaged 429 output tokens and $0.011 each, vs about
# $0.05 for Opus low subagent requests.
cost = 0.14
criteria = "Mechanical, fully specified work: finding files, listing or extracting facts, grepping, applying an explicit edit, one-line answers."

[tiers.subagent.sonnet-low]
rank = 2
model = "claude-sonnet-5-5"
effort = "low"
criteria = "Reading and reporting that needs some understanding but little reasoning: summarizing a file, a diff or a log, explaining what a piece of code does, answering a question about the code from a few files."

[tiers.subagent.opus-low]
rank = 3
model = "claude-opus-5-5"
effort = "low"
criteria = "Small self-contained changes or checks that need a little judgment: a focused edit or fix, updating a few call sites, checking how something behaves."

# Sonnet 5.5 at high is on the cost/quality frontier on every benchmark with
# per-effort data, between Opus low and Opus medium: index v4.3.2 47 at
# $1.08 (Opus low 42 at $0.55, medium 51 at $1.34), CursorBench 47.8% at
# $1.67 (43.7% at $1.17, 52.5% at $2.91), Terminal-Bench 4.0 (Anthropic)
# 43.0% at $1.94 (38.5% at $1.29, 57.6% at $2.94), FrontierCode 49.4 at
# $0.42 (47.3 at $0.40, 54.6 at $0.80). Subagents start with a fresh
# context, so a model switch costs nothing there.
[tiers.subagent.sonnet-high]
rank = 4
model = "claude-sonnet-5-5"
effort = "high"
criteria = "Bounded work that follows a known recipe in one area and takes more than a quick edit: writing tests for existing code, adding a small feature by copying an existing pattern, a mechanical refactor across a few files, tracing a flow through a few files and reporting it, updating docs or a spec to match the code."

[tiers.subagent.opus-medium]
rank = 5
model = "claude-opus-5-5"
effort = "medium"
criteria = "Routine work that needs some design or research: a small component with nothing in the codebase to copy, a data migration with a few edge cases, comparing approaches and recommending one."

[tiers.subagent.opus-high]
rank = 6
model = "claude-opus-5-5"
effort = "high"
criteria = "Multi-file investigation or implementation with real edge cases and some design decisions."

[tiers.subagent.opus-xhigh]
rank = 7
model = "claude-opus-5-5"
effort = "xhigh"
criteria = "Hard debugging, reviews for subtle bugs, security or concurrency analysis, proofs; a wrong answer is expensive."

[tiers.subagent.opus-max]
rank = 8
model = "claude-opus-5-5"
effort = "max"
criteria = "Open-ended hardest problems needing the deepest reasoning, where cost is secondary."

# ------------------------------------------------------------- questions
# What Jev is asked besides the tier criteria and the modes' and asked
# tiers' own questions: the Score question's instructions per scope, the
# relation of a main-session prompt to the work in progress, and the
# yes/no that confirms each request a prompt's words may make. A wording
# change is kept only if it wins on the train split and holds on a
# held-out set (.claude/skills/refresh-model-catalog/references/routing-eval.md).
# [questions.continues] and [questions.informs], the warm-turn questions
# the relation question replaced, are still read and ignored.

[questions.level]
main = "How much reasoning does the work that the new prompt starts need, judging by what that work actually involves (a short prompt can approve a large job)? When the prompt hands work to subagents, judge only what this session does itself (launching them, then relaying or merging their reports): each subagent gets its own level."
subagent = "How much capability and reasoning does this subagent task need?"

# The level question rates the new prompt's own words; the effort runs the
# whole turn, which carries the pending work on. This Choice (asked once
# there is work in progress, with its goal and level in the state) says
# whether the prompt follows that work up (continue, extend, inform,
# side_question: at least the work's level) or is separate from it
# (wrap_up, new_task: its own level; aside, a question unrelated to the
# work or about automodel's routing: its own level for that turn, the work
# unchanged). A wrap-up, a side question or an aside runs without the
# work's mode. Once a wrap-up marked the work done, only more work on it
# (continue, extend) holds, and a go-ahead is asked here too: "looks good"
# mostly acknowledges finished work, and "yes" to "Want me to open the
# PR?" is a wrap-up step (final review: 9 of 9 live answers read it as
# continue and reopened the done work at its xhigh). After a detour, a
# go-ahead to a proposal is asked here too (round 4): the proposal may be
# to go back to the paused work (resume), a wrap-up step of the detour
# ("Committed. Want me to push it?") or more of it; "yes" to "Shall I get
# back to the migration?" read continue 0.50-0.59 while continue's wording
# said "resume the work in progress", and reads resume 0.9+ now. When the
# paused work needs more, [questions.offer] decides whether the go-ahead
# stays on the detour (round 4 review: closing questions such as "Anything
# else?" read continue up to 0.81 here). One Choice, not two yes/no: the
# probabilities of a Choice add up, and one question per judgment. Options
# in TypeSafe's advanced structure (what, not_for, examples), English with
# French examples (Jev reads English best; the prompts are often French).
[questions.relation]
question = "How does the new prompt `task` relate to the work in progress (started by `work_in_progress.goal`, carried on in `recent_prompts`, last reported in `last_assistant`; `work_in_progress.done` once it was wrapped up)?"

[questions.relation.options.continue]
what = "Tells the assistant to go ahead with or keep going on the work in progress (`work_in_progress.goal`) as it stands, also after a break, possibly at another effort, on another model or without the parallel agents, or to carry out what it just proposed or offered for that same work (possibly picking one of its options), and asks for nothing more. A question or a remark that comes with the go-ahead, even an unrelated one, doesn't change that: the work goes on."
not_for = "Going back to the paused work (`paused_work.goal`), including a go-ahead to the assistant's offer to get back to it ('yes' to 'Shall I get back to the migration?'), and a go-ahead once the detour is finished when `last_assistant` offers nothing more of it and only closes on a question such as 'Anything else?' or 'Autre chose ?' (resume); a go-ahead that also adds or changes something (extend); an acknowledgement once the work is done (`work_in_progress.done`) and nothing is left to go on with, such as 'looks good', 'ok, thanks' or 'merci' (aside); a go-ahead to a wrap-up step the assistant proposed once the work is done, such as committing, pushing, opening the PR or writing the changelog entry ('yes' to 'Want me to open the PR?') (wrap_up)."
examples = ["yes", "go", "continue", "ok ship it", "ok, do what you proposed", "go with option 2", "resume, the limits are reset", "out of curiosity, why is the status line orange? anyway, carry on", "vas-y", "oui, continue", "oui, fais ce que tu proposes", "c'est bon, on y va"]

[questions.relation.options.extend]
what = "Adds to, constrains or corrects the work in progress, which stays the same piece of work: another case or input to handle (one more file or module for the audit or the review in progress), a test for it or for behaviour it added or changed, an option or a flag for what it built, a requirement, a different approach, or a step it calls for, such as repairing what the problem it fixes left behind (the data, the orders or the charges it got wrong), or fixing a regression or a side effect the work caused ('since the refactor, the dialog text is cut off: can you check that too?')."
not_for = "Work that stands on its own without the work in progress, including the same change repeated on another target (new_task)."
examples = ["also add a test for that", "and make it configurable", "but keep the old flag working", "no, use a channel instead", "and write the script that fixes the rows it corrupted", "since your change the export button stays greyed out, can you look?", "ajoute aussi un log quand ça échoue", "mais garde l'ancienne API", "non, fais plutôt une migration", "depuis ta modif le tri ne marche plus sur mobile, tu regardes ?"]

[questions.relation.options.inform]
what = "Only gives a fact, a preference or an answer the work in progress needs, and asks for no new work: about the work itself or how a part of it may be run when nothing is to be changed for it (the effort or the model a subagent can run at for one step), or about its environment, resources, schedule or people (which machines are free and until when, who shares them, who owns what, when someone is away)."
not_for = "A message that also asks for a change or a check (extend), including setting something in a file or a config, even a subagent's effort (new_task or extend)."
examples = ["FYI it only fails on ARM", "env vars win", "camelCase", "the snapshot-refresh subagent can stay at low effort", "the staging cluster only has 4 GPUs free until noon", "FYI the build farm is shared with the mobile team this week", "heads-up: Sam, who reviews the billing code, is off until Monday", "c'est la v2 de l'API", "la clé est dans le .env", "le runner de CI n'est dispo que jusqu'à 17h", "au fait, Léa est en congés cette semaine et c'est elle qui valide les déploiements"]

[questions.relation.options.side_question]
what = "Asks a question or a quick check about the work in progress itself while it is still pending (steps remain, it is running, or a proposal awaits an answer), and only needs an answer: its progress or status, a detail of its code, a choice it made, a doubt, a check of its result, or which model or mode would suit it."
not_for = "A question about automodel's routing, such as why this session or a subagent got, kept or changed its effort, its model or its mode, or what the status line shows (aside), unless routing is what the work in progress builds or tunes; a question about model prices, also compared on the work at hand (aside), not about which model would suit it; a question unrelated to the work in progress (aside); a question that also tells the assistant to carry on with the work, such as 'just curious, keep going' (continue); a question that starts real work of its own, such as an investigation or a change (new_task); a question about work that is finished, which only recalls or explains it (wrap_up)."
examples = ["is CI green yet?", "why did you pick a mutex there?", "does that cover the retry path too?", "which Go version do we target again?", "t'en es où ?", "le build passe ?", "pourquoi un mutex et pas un channel ?"]

# A question unrelated to the work in progress, or about automodel's
# routing ("why did it keep this session at xhigh?"): its own level for
# that turn, the work in progress (and any paused work) unchanged. Routing
# questions were side questions until round 3, which held a question about
# the router at the work's xhigh (held-out run 1). A fact about the work's
# environment, resources, schedule or people is inform, and an instruction
# is never an aside: in the final review, which cluster nodes are free and
# until when read as an aside (0.67-0.87) and lowered xhigh work, and so did
# an instruction to set an effort in a tuning file (0.53). Round 4: what the
# status line shows and what models cost are asides too (they read as side
# questions at 0.46-0.65 and held xhigh work); which model would suit the
# work stays a side question.
[questions.relation.options.aside]
what = "A question or a remark that is not about the work in progress itself and starts no work of its own: general knowledge, a command or a flag, another topic, news, a comment in passing or a thank-you, or a question about automodel's routing (why this session or a subagent got, kept or changed its effort, its model or its mode, or what the status line shows), or about model prices, also compared on the work at hand."
not_for = "A question about the work in progress, its code, its choices or its result, including which model or mode would suit it (side_question), and routing questions when routing is what the work in progress builds or tunes; a prompt that also tells the assistant to go on with the work, even after a question ('just curious, carry on'), or asks for an effort, a model or a mode for it (continue, extend); a fact or a constraint for the work, even about a subagent (the effort or the model it can run at) or a config, or about its environment, resources, schedule or people, such as which machines are free and until when or who shares them (inform, extend); any instruction to do or change something, even small or in a config or a tuning file (new_task or extend); a question that reports something wrong or surprising, such as 'why does it show X when Y?' or an image of odd behaviour: it asks for an investigation, and most often a fix (new_task, or extend when it is about what the work builds)."
examples = ["unrelated: how do I list open ports on macOS?", "what does HTTP 409 mean again?", "Fable 5.1 is out, have you seen the benchmarks?", "why did the effort go up just now?", "au fait, c'est quoi la différence entre rebase et merge ?", "ça veut dire quoi idempotent, déjà ?", "pourquoi cette session tourne sur Opus ?", "haha, nice", "merci !"]

# Only offered when a detour paused earlier work (paused_work in the state).
[questions.relation.options.resume]
what = "Goes back to the paused work (`paused_work.goal`), which a detour set aside, now that the detour is done or dropped: by naming it, by accepting the assistant's offer to get back to it ('yes', 'oui' or 'go ahead' when `last_assistant` asks 'Shall I get back to the migration?'), or by a go-ahead or a question about what comes next once the detour is finished, also when `last_assistant` closes on a question that offers nothing more of the detour ('Anything else?', 'Autre chose ?')."
not_for = "Going on with the detour itself, including a go-ahead to more of it that the assistant offered ('yes' to 'Want me to fix the two other typos too?') (continue); a wrap-up step of the detour the assistant offered ('yes' to 'Want me to push it?') (wrap_up); a piece of work neither of them is about (new_task)."
examples = ["back to the migration", "ok, now let's get back to the refactor", "continue the audit", "ok, and now?", "yes (to 'Done. Shall I get back to the migration?')", "reprends le refacto", "on revient à la migration", "bon, on reprend l'audit", "et maintenant ?", "oui (à « C'est fait. On reprend le refacto ? »)"]

[questions.relation.options.wrap_up]
what = "Wraps up work that is finished: a summary or a recap, a commit message, a PR description, a push, a changelog entry, or a question that only recalls or explains the finished work (what changed, how it works, why it was done that way). A go-ahead to such a step the assistant proposed once the work is done ('yes' to 'Want me to push the branch and open the PR?') is a wrap-up too, also when other work waits, paused ('yes' to 'Committed. Want me to push it?' after a detour)."
not_for = "Finishing or fixing the work itself (extend); a question while the work is still pending (side_question)."
examples = ["write the commit message", "summarize what you changed", "open the PR", "push it", "yes, push it and open the PR", "how does the new retry work, in two sentences?", "résume ce que tu as fait", "c'était quoi le problème, finalement ?", "fais le commit et pousse", "oui, vas-y pour la PR"]

[questions.relation.options.new_task]
what = "Starts a separate piece of work (a change, a fix, a feature, an investigation) that the work in progress doesn't include, even one that repeats its pattern on another target (another endpoint, page or module)."
not_for = "More work on the work in progress itself, such as a test of what it added or one more file for the audit or the review it is, or a problem it caused (extend); carrying out what the assistant just proposed for it (continue); a question that starts no work (side_question, aside)."
examples = ["now rename the config loader", "next: design how to shard the job queue", "now the same retry logic for the email sender", "unrelated, but the login page is slow", "autre chose : mets à jour le README", "passons au module de facturation"]

# A bare go-ahead after a detour, when the paused work needs more and the
# assistant's last message asks something: going back to the paused work
# is the default (a bare go-ahead goes back to it without asking), and
# this yes/no says whether the assistant offered one more thing for the
# detour instead (a wrap-up step, more of it), which the go-ahead accepts.
# Round 4's review: the relation question alone read "go" after "Anything
# else?" as continue up to 0.62 and "Shall I carry on?" 0.77-0.81, while
# offers of more of the detour read continue from 0.45 and a changelog
# step wrap_up from 0.38: no bar on the relation told them apart. Second
# review: a bare acknowledgement ("nickel", "lgtm") read as no; the yes
# wording says it accepts the offer, and the no wording that the message
# decides, whatever the go-ahead's words ("Can I go on?" paraphrases the
# train's "Shall I carry on?": those cases are in-sample).
[questions.offer]
question = "The new prompt `task` is a go-ahead after a detour (`work_in_progress.goal`) that set bigger work aside (`paused_work.goal`). Does the assistant's last message (`last_assistant`) offer or ask to do one more specific thing for the detour itself, which that go-ahead accepts?"
yes = "Near its end the message names one more specific thing it would do for the detour, and the go-ahead says yes to it: a wrap-up step of the detour ('Shall I open a PR for it?', 'Je pousse la branche ?') or more of it ('The same null check is missing in the export handler: want me to add it there too?', 'Je fais pareil dans le module d'import ?'), also when a remark follows the offer ('Shall I push the branch? CI takes about ten minutes.'), when the offer has no question mark ('dis-moi si je lance aussi le linter'), or when the go-ahead is only an acknowledgement ('ok', 'perfect', 'lgtm', 'super', 'top', 'nickel', 'parfait'): right after an offer, it accepts it."
no = "The message names nothing more to do for the detour: it reports the detour done or where it stands and closes on a general question or a check that names no step of it ('Anything else?', 'Is that OK?', 'Can I go on?', 'Autre chose ?'); or it offers to go back to the paused work ('Shall I get back to the migration?', 'On reprend la migration ?'); or the go-ahead answers something else. The message decides, whatever the go-ahead's words."

# Requests in prose ("passe en xhigh", "fais ça en ultracode", "think
# harder", "dial it back to medium", any language). Every main-session
# prompt gets three Choices, one per kind: the effort it asks the assistant
# to work at (or more thinking), the workflow mode asked for or refused,
# the model asked for; "none" when it asks for nothing of that kind. No word
# list picks the questions: before 2026-10 a regex did, and every wording it
# lacked ("dial it back to medium") was missed. One Choice per kind, not a
# yes/no per value: asked apart, "passe en xhigh" also read yes to high, max
# and the mode (train precision 34%); as options they compete. They ask
# about the action, not the subject, and about the assistant's own work:
# effort names are often only talked about ("why did it stay at xhigh?") or
# set for something else (a subagent, a workflow stage, a tuning file, a
# quoted prompt). The ultrathink keyword needs no question (a floor at
# xhigh). {v} is the mode's ID, or the model's label.
[questions.explicit_effort]
question = "Does the new prompt `task` ask the assistant itself to work at a given reasoning effort, or to think more than usual, for its own work (this prompt, a part of it, or the rest of the work in progress)? Pick the level the prompt names, more when it asks to think more without naming one, or none. The request can take any wording, in any language. Only when it names no level but a step from the current one ('one notch lower', 'un cran au-dessus') is it the level next to `current.effort`, in the order low, medium, high, xhigh, max."

[questions.explicit_effort.options.none]
what = "It asks for no effort of the assistant's own: most prompts. Also when it only talks about effort or thinking (a question, a mention, news, a complaint, a refusal), sets an effort for something else (subagents, workflow agents or a workflow stage, a config, a tuning or catalog entry, automodel's routing), quotes or tests a prompt that contains one, uses the ultrathink keyword (handled apart), or only asks for a mode with several agents or for a model."
not_for = "A request for the assistant's own effort, up or down, also as a cap, for a part of the work or with a reason ('low is enough for the changelog', 'dial it back to medium', 'think harder about it')."
examples = ["fix the failing test", "go through the payment module carefully and list every unchecked error", "look into the memory leak in depth this time", "automodel put this at low but it looks tricky to me", "why did it stay at xhigh?", "give the review agents low effort", "effort = \"medium\" in the stage config", "a test that the prompt \"fais-le en max\" pins nothing", "max retries is 3", "the hot path needs low latency", "use ultracode for the audit", "switch to Sonnet for this", "ultrathink: is the lease renewed under the lock?", "pas besoin de xhigh ici", "le CPU tourne à fond"]

[questions.explicit_effort.options.low]
what = "The low effort (low, faible, bas, minimal, the lowest), as an instruction or a wish, also as a cap or for easier work."
not_for = "Another level named."
examples = ["passe en low", "low is enough for the changelog", "go back to low for this one", "low effort is fine for that summary", "faible suffit pour ça", "mets l'effort à low pour les fichiers de traduction"]

[questions.explicit_effort.options.medium]
what = "The medium effort (medium, moyen, mid), as an instruction or a wish, also as a cap or for easier work."
not_for = "Another level named."
examples = ["set your effort to medium for the rest", "dial it back to medium", "drop to medium for what's left, it's boilerplate", "medium is enough from here", "repasse en medium pour la suite, c'est mécanique", "moyen suffit pour le reste"]

[questions.explicit_effort.options.high]
what = "The high effort, named high (or élevé, haut), as an instruction or a wish, also as a cap or for easier work than now."
not_for = "xhigh or max, named so; more thinking with no level named (more)."
examples = ["switch to high effort for the migration", "high is fine for the remaining wiring", "high, no more: it's routine", "mets l'effort à high pour la suite", "effort élevé pour ça"]

[questions.explicit_effort.options.xhigh]
what = "The xhigh effort (extra high, x-high), as an instruction or a wish."
not_for = "high and max, which are other levels; the ultracode mode (several agents), which is no effort level."
examples = ["do this at xhigh", "x-high for this one please", "passe en xhigh", "fais la suite en xhigh"]

[questions.explicit_effort.options.max]
what = "The max effort (maximum, the highest level), as an instruction or a wish."
not_for = "xhigh, another level; more thinking with no level named (more)."
examples = ["max effort on this", "use the maximum reasoning effort for the proof", "fais-le en max", "passe au max pour celle-là"]

[questions.explicit_effort.options.more]
what = "It asks the assistant to think more than it would, with no level named: think harder, longer or more carefully than usual, take its time, go all out."
not_for = "A task described as thorough, careful, in depth or harder ('check every path in detail', 'investigate it properly', 'examine the diff closely', 'the next one is harder'): the level judges the task, that is no request. A remark that the level automodel or Jev picked was too low. A level named (low to max); the ultrathink keyword; thinking less."
examples = ["think harder about it", "take your time on this one", "think it through more carefully than last time", "réfléchis bien avant de toucher au verrou", "prends ton temps", "mets le paquet sur celle-là"]

[questions.explicit_mode]
question = "Does the new prompt `task` ask the assistant itself to do its own work in the {v} mode (several agents working in parallel, orchestrated as a workflow), or to do it without that mode or stop it? Pick what it asks, or none. The request can take any wording, in any language."

[questions.explicit_mode.options.none]
what = "Neither: most prompts. Also a question, a mention or a complaint about the mode or workflows, turning parallel work on or off for something else (a workflow stage, a config, a subagent), agents that are not the assistant's (CI build agents, support agents), and requests for an effort level or more thinking ('passe en xhigh', 'think harder', 'max effort') or for a model, which are not this mode."
not_for = "Asking for the mode or several agents doing the assistant's work (on), or asking to work without them (off)."
examples = ["fix the failing test", "{v} was slow yesterday", "did the workflow finish?", "have one review agent check the migration, then apply its notes yourself", "send a subagent to find which test is flaky and report back", "inutile de changer de modèle, termine la doc", "no need for max effort on the changelog", "disable the parallel stage in the config", "our CI spreads the e2e suite across 4 build agents", "passe en xhigh pour la suite", "think harder about the lock", "should we use {v} for this kind of audit?"]

[questions.explicit_mode.options.on]
what = "It asks for the mode: {v} by name, a workflow, or several agents or subagents doing the assistant's work in parallel."
not_for = "One subagent for one task; an effort level or more thinking alone; agents that are not the assistant's; only talking about the mode."
examples = ["use {v} for the audit", "fais-le en {v}", "run it with several agents in parallel", "fan this out to subagents", "split the remaining packages across 4 agents", "répartis ça entre plusieurs agents en parallèle", "lance plusieurs sous-agents sur les modules"]

[questions.explicit_mode.options.off]
what = "It asks the assistant to work without the mode or to stop it, usually doing the work itself, one at a time."
not_for = "Asking for the mode; turning it off for something else (a config, a workflow stage); refusing an effort level or a model ('pas besoin de max', 'no need for Opus', 'pas besoin de passer sur Sonnet'): only the mode with several agents counts."
examples = ["no {v} for this", "skip the workflow, just fix it", "no more agents, do the rest yourself one by one", "single-thread from here", "pas besoin d'{v}", "sans workflow", "arrête les agents en parallèle, fais la suite toi-même"]

[questions.explicit_model]
question = "Does the new prompt `task` ask the assistant itself to run on another model for its own work (this prompt, a part of it, or the rest of the work in progress), instead of the one it runs on now? Pick that model, or none. The request can take any wording, in any language."

[questions.explicit_model.options.none]
what = "No model asked for the assistant itself: most prompts. Also talking about models (release news, comparisons, prices, benchmarks, why automodel picked one), setting a model for something else (a subagent, workflow agents or a stage, a config, a tuning or catalog entry), a quoted prompt or test string, a refusal, and requests for an effort level or a mode only."
not_for = "Asking the assistant to switch to a model, go back to one, or do this work or a part of it with one."
examples = ["fix the failing test", "Sonnet 5.5 is out", "is Sonnet cheaper than Opus?", "why did it pick Opus?", "make the review agent use sonnet", "pas besoin d'Opus", "Opus a mis 3 minutes", "passe en xhigh"]

[questions.explicit_model.options.model]
what = "{v}: it asks the assistant to switch to {v}, to go back to it, or to do this work, the rest of it or one part of it (a step, a test, a file) with it, as an instruction or a wish, often with the reason."
not_for = "Another model named; only talking about {v}."
examples = ["switch to {v} for this", "do the rest with {v}", "take {v} for this bit, it's routine", "back to {v} for the rest of it", "passe sur {v} pour la suite", "fais ça avec {v}"]


# ----------------------------------------------------------------- state
# How much of the conversation the main session's state shows Jev (within
# the config's state_budget_tokens).

[state]
recent_prompts = 5
last_assistant_tokens = 1500
