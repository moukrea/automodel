# ------------------------------------------------------------ main tiers
# Opus tiers vary only the effort (per-turn effort keeps the prompt cache
# across effort changes). Their criteria are the levels of Jev's Score
# question, lowest first: describe situations, not degrees.
#
# Haiku is an asked tier: its own yes/no question, asked in the same call,
# and it replaces low when Jev says yes (threshold from `automodel eval`,
# train split: Haiku cases >= 0.95, other low cases <= 0.90). It changes the
# model, which rebuilds the prompt cache, so it is taken on a new session,
# after /compact or a pause (no cache to lose) or when already on it; a warm
# Opus session never moves there (a Haiku turn on a warm cache costs about
# Opus low, and coming back rebuilds the context).
[tiers.main.haiku]
rank = 0
model = "claude-haiku-4-5"
# Priced as it runs (no thinking), like the Haiku subagent tier.
cost = 0.14
# Haiku's window is 200k: past this the session moves up to Opus (routing
# constrains to the next tier that fits; the proxy does it within a turn).
max_context = 150_000
question = "Could a small, fast model handle this prompt just as well: no reasoning, and no need to look at the code or the work so far?"
criteria = "A general knowledge question, a command or a flag, what an error code or a regex means, or a trivial edit spelled out in full (a typo, one rename in one file)."
no = "Anything that needs this project's code, the conversation or some thought: a question about the project or the work done, a bug to investigate, a change with choices, a review, a summary or a commit message."
threshold = 0.92


[tiers.main.low]
rank = 1
model = "claude-opus-5-5"
effort = "low"
criteria = "Answering a question or making a small, fully specified change: lookups, explaining a known concept, renames, typo fixes, formatting, commit messages, summaries of work already done."

[tiers.main.medium]
rank = 2
model = "claude-opus-5-5"
effort = "medium"
criteria = "A routine change with a clear recipe in one area: a small feature or endpoint with tests, a bug whose cause is evident, straightforward tests or docs for existing code."

[tiers.main.high]
rank = 3
model = "claude-opus-5-5"
effort = "high"
criteria = "A change spanning several files or components, with real edge cases and some design choices: refactors, integrations, migrating a module, performance work on a known bottleneck."

[tiers.main.xhigh]
rank = 4
model = "claude-opus-5-5"
effort = "xhigh"
criteria = "A hard problem where a wrong answer is expensive: race conditions and concurrency, security-sensitive logic, subtle bugs of unknown cause, architecture with trade-offs, correctness arguments."

[tiers.main.max]
rank = 5
model = "claude-opus-5-5"
effort = "max"
criteria = "Exceptional difficulty: long-standing bugs nobody could find, research-grade algorithms or proofs, where exhaustive reasoning is worth any cost."

# ------------------------------------------------------------------ modes
# A mode is layered on top of whatever tier (and model) is chosen.

[modes.ultracode]
scopes = ["main"]
workflows = true
effort = "xhigh"
min_tier = "high"
threshold = 0.75  # from `automodel eval`: yes-cases >= 0.85, no-cases <= 0.68
question = "Would this work be done better by several agents working in parallel (workflow orchestration) than by one assistant working alone?"
yes = "Broad work that splits into many independent parts: auditing or reviewing a whole codebase, sweeping migrations across many files or services, multi-angle research or plans cross-checked by independent reviewers."
no = "Work one assistant does well alone: a single feature, bug, question, or refactor of one area, and anything small or sequential."

# -------------------------------------------------------- subagent tiers
# The Agent tool only accepts model aliases, so subagent models need `alias`.

[tiers.subagent.haiku]
rank = 1
model = "claude-haiku-4-5"
# Priced as it runs (no thinking): a quarter of Opus 5.5's per-token prices
# × Opus low's cost per task (0.55). Ledger 2026-09-27: 115 routed Haiku
# subagent requests averaged 429 output tokens and $0.011 each, vs about
# $0.05 for Opus low subagent requests.
cost = 0.14
criteria = "Mechanical, fully specified work: finding files, listing or extracting facts, grepping, applying an explicit edit, one-line answers."

[tiers.subagent.sonnet-low]
rank = 2
model = "claude-sonnet-5-5"
effort = "low"
criteria = "Reading and reporting that needs some understanding but little reasoning: summarizing a file, a diff or a log, explaining what a piece of code does, answering a question about the code from a few files."

[tiers.subagent.opus-low]
rank = 3
model = "claude-opus-5-5"
effort = "low"
criteria = "Small self-contained changes or checks that need a little judgment: a focused edit or fix, updating a few call sites, checking how something behaves."

# Sonnet 5.5 at high is on the cost/quality frontier on every benchmark with
# per-effort data, between Opus low and Opus medium: index v4.3.2 47 at
# $1.08 (Opus low 42 at $0.55, medium 51 at $1.34), CursorBench 47.8% at
# $1.67 (43.7% at $1.17, 52.5% at $2.91), Terminal-Bench 4.0 (Anthropic)
# 43.0% at $1.94 (38.5% at $1.29, 57.6% at $2.94), FrontierCode 49.4 at
# $0.42 (47.3 at $0.40, 54.6 at $0.80). Subagents start with a fresh
# context, so a model switch costs nothing there.
[tiers.subagent.sonnet-high]
rank = 4
model = "claude-sonnet-5-5"
effort = "high"
criteria = "Bounded work that follows a known recipe in one area and takes more than a quick edit: writing tests for existing code, adding a small feature by copying an existing pattern, a mechanical refactor across a few files, tracing a flow through a few files and reporting it, updating docs or a spec to match the code."

[tiers.subagent.opus-medium]
rank = 5
model = "claude-opus-5-5"
effort = "medium"
criteria = "Routine work that needs some design or research: a small component with nothing in the codebase to copy, a data migration with a few edge cases, comparing approaches and recommending one."

[tiers.subagent.opus-high]
rank = 6
model = "claude-opus-5-5"
effort = "high"
criteria = "Multi-file investigation or implementation with real edge cases and some design decisions."

[tiers.subagent.opus-xhigh]
rank = 7
model = "claude-opus-5-5"
effort = "xhigh"
criteria = "Hard debugging, reviews for subtle bugs, security or concurrency analysis, proofs; a wrong answer is expensive."

[tiers.subagent.opus-max]
rank = 8
model = "claude-opus-5-5"
effort = "max"
criteria = "Open-ended hardest problems needing the deepest reasoning, where cost is secondary."

# ------------------------------------------------------------- questions
# What Jev is asked besides the tier criteria and the modes' and asked
# tiers' own questions: the Score question's instructions per scope, the
# relation of a main-session prompt to the work in progress, and the
# yes/no that confirms each request a prompt's words may make. A wording
# change is kept only if it wins on the train split and holds on the
# held-out split (.claude/skills/refresh-model-catalog/references/routing-eval.md).
# [questions.continues] and [questions.informs], the warm-turn questions
# the relation question replaced, are still read and ignored.

[questions.level]
main = "How much reasoning does the work that the new prompt starts need, judging by what that work actually involves (a short prompt can approve a large job)? When the prompt hands work to subagents, judge only what this session does itself (launching them, then relaying or merging their reports): each subagent gets its own level."
subagent = "How much capability and reasoning does this subagent task need?"

# The level question rates the new prompt's own words; the effort runs the
# whole turn, which carries the pending work on. This Choice (asked once
# there is work in progress, with its goal and level in the state) says
# whether the prompt follows that work up (continue, extend, inform,
# side_question: at least the work's level) or is separate from it
# (wrap_up, new_task: its own level). One Choice, not two yes/no: the
# probabilities of a Choice add up, and one question per judgment. Options
# in TypeSafe's advanced structure (what, not_for, examples), English with
# French examples (Jev reads English best; the prompts are often French).
[questions.relation]
question = "How does the new prompt `task` relate to the work in progress (started by `work_in_progress.goal`, carried on in `recent_prompts`, last reported in `last_assistant`)?"

[questions.relation.options.continue]
what = "Tells the assistant to go ahead with, keep going on or resume the work in progress as it stands, and asks for nothing more."
not_for = "A go-ahead that also adds or changes something (extend)."
examples = ["yes", "go", "continue", "ok ship it", "resume, the limits are reset", "vas-y", "oui, continue", "c'est bon, on y va"]

[questions.relation.options.extend]
what = "Adds to, constrains or corrects the work in progress, which stays the same piece of work: another case to handle, a test for it, a requirement, a different approach."
not_for = "Work that stands on its own, without the work in progress (new_task)."
examples = ["also add a test for that", "and make it configurable", "but keep the old flag working", "no, use a channel instead", "ajoute aussi un log quand ça échoue", "mais garde l'ancienne API", "non, fais plutôt une migration"]

[questions.relation.options.inform]
what = "Only gives a fact, a preference or an answer the work in progress needs, and asks for no new work."
not_for = "A message that also asks for a change or a check (extend)."
examples = ["FYI it only fails on ARM", "env vars win", "camelCase", "c'est la v2 de l'API", "la clé est dans le .env"]

[questions.relation.options.side_question]
what = "Asks a question or a quick check aside (progress, status, why something was done) while the work in progress stays pending."
not_for = "A question that opens an investigation of its own (new_task)."
examples = ["is CI green yet?", "why did you pick a mutex there?", "which Go version do we target again?", "t'en es où ?", "le build passe ?", "pourquoi ce choix de lib ?"]

[questions.relation.options.wrap_up]
what = "Wraps up work that is done: a summary, a commit message, a PR description, a push, a changelog entry."
not_for = "Finishing or fixing the work itself (extend)."
examples = ["write the commit message", "summarize what you changed", "open the PR", "push it", "résume ce que tu as fait", "fais le commit et pousse"]

[questions.relation.options.new_task]
what = "Starts a separate piece of work, unrelated to the work in progress or independent of it."
not_for = "More work on the work in progress (extend), or a question about it (side_question)."
examples = ["now rename the config loader", "next: design how to shard the job queue", "unrelated, but the login page is slow", "autre chose : mets à jour le README", "passons au module de facturation"]

# Requests in prose ("passe en xhigh", "fais ça en ultracode", "think
# harder"). A regex finds the words that may make one (an effort name, the
# think-harder family, ultracode or workflows and their refusal, a model
# name); only then is this yes/no asked, once per request, {x} naming it
# (from effort/more/mode/model, {v} the effort, the mode or the model).
# It asks about the action, not the subject: effort names are often only
# talked about ("why did it stay at xhigh?"). The ultrathink keyword needs
# no question (a floor at xhigh).
[questions.explicit]
question = "Does the new prompt `task` explicitly ask the assistant to use {x} for this work?"
yes = "It asks for it, as an instruction or a wish, in any language: 'do this at xhigh', 'use ultracode for the audit', 'switch to Sonnet', 'think harder about it', 'passe en low', 'fais-le en ultracode', 'réfléchis à fond'."
no = "It only mentions, quotes, discusses or questions it, or refuses it: 'why did it stay at xhigh?', 'max retries is 3', 'the workflow failed', 'ultracode was slow', 'pas besoin de xhigh ici', 'le CPU tourne à fond'."
off_question = "Does the new prompt `task` explicitly ask the assistant to stop using {x}, or not to use it, for this work?"
off_yes = "It asks to stop it or to do without it, in any language: 'no ultracode for this', 'without workflows', 'stop the parallel agents', 'pas besoin d'ultracode', 'sans workflow', 'arrête les agents en parallèle'."
off_no = "It asks for it, only mentions it, or says nothing against it: 'use ultracode', 'did the workflow finish?', 'ultracode était lent hier'."
effort = "the {v} reasoning effort"
more = "more thinking than so far (thinking harder, longer or more carefully)"
mode = "{v}, several agents working in parallel (workflow orchestration)"
model = "the {v} model"

# ----------------------------------------------------------------- state
# How much of the conversation the main session's state shows Jev (within
# the config's state_budget_tokens).

[state]
recent_prompts = 5
last_assistant_tokens = 1500
